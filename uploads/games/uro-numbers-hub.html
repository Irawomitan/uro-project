<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uro Numbers Hub</title>
<!-- Vercel Web Analytics -->

<script defer src="/_vercel/insights/script.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0d0b1e;}
  body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;overflow-x:hidden;color:white;}
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
  .star{position:absolute;border-radius:50%;background:white;animation:twinkle 3s infinite alternate;}
  @keyframes twinkle{from{opacity:.2;transform:scale(1)}to{opacity:1;transform:scale(1.4)}}
  .screen{display:none;position:relative;z-index:1;min-height:100vh;padding:20px;}
  .screen.active{display:block;}
  #hub{padding:30px 20px;}
  .hub-header{text-align:center;margin-bottom:36px;}
  .hub-header h1{font-family:'Fredoka One',cursive;font-size:clamp(2rem,6vw,4.5rem);background:linear-gradient(135deg,#ffd93d,#ff6b6b,#c77dff,#4d96ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:hue 5s linear infinite;}
  @keyframes hue{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
  .hub-header p{color:#aaa;font-size:1.1rem;margin-top:8px;}
  .lang-badge{display:inline-block;background:linear-gradient(135deg,#ff6b6b,#c77dff);padding:4px 18px;border-radius:20px;font-size:.85rem;font-weight:700;margin-top:8px;}
  .grade-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:36px;}
  .grade-btn{padding:8px 20px;border:2px solid #444;border-radius:20px;background:transparent;color:#aaa;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;transition:.3s;}
  .grade-btn:hover,.grade-btn.active{border-color:#ffd93d;color:#ffd93d;background:rgba(255,217,61,.1);}
  .games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;max-width:1100px;margin:0 auto;}
  .game-card{border-radius:24px;padding:28px 22px;cursor:pointer;position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s;text-align:center;background:linear-gradient(145deg,var(--c1),var(--c2));}
  .game-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .game-card .emoji{font-size:3.5rem;display:block;margin-bottom:12px;animation:bounce 2s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .game-card h3{font-family:'Fredoka One',cursive;font-size:1.5rem;color:white;margin-bottom:6px;text-shadow:0 2px 8px rgba(0,0,0,.3);}
  .game-card p{font-size:.85rem;color:rgba(255,255,255,.85);line-height:1.4;}
  .game-card .badge{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.3);border-radius:12px;padding:3px 10px;font-size:.75rem;font-weight:700;}
  .game-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 60%);pointer-events:none;}
  #game-screen{padding:20px;max-width:800px;margin:0 auto;}
  .back-btn{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:white;padding:8px 20px;border-radius:20px;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:700;transition:.3s;margin-bottom:24px;display:inline-flex;align-items:center;gap:8px;}
  .back-btn:hover{background:rgba(255,255,255,.2);}
  .game-title{font-family:'Fredoka One',cursive;font-size:2.2rem;text-align:center;margin-bottom:16px;}
  .score-bar{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 20px;margin-bottom:20px;}
  .score-item{text-align:center;}
  .score-item .val{font-family:'Fredoka One',cursive;font-size:1.8rem;color:#ffd93d;}
  .score-item .lbl{font-size:.75rem;color:#aaa;}
  .q-card{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.1);border-radius:24px;padding:32px;text-align:center;margin-bottom:20px;}
  .q-number{font-family:'Fredoka One',cursive;font-size:4rem;color:white;text-shadow:0 0 30px rgba(255,217,61,.4);}
  .q-uro{font-size:1rem;color:#aaa;margin-top:4px;}
  .q-label{font-size:1rem;color:#888;margin-bottom:12px;}
  .math-display{font-family:'Fredoka One',cursive;font-size:3rem;color:white;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;}
  .math-num{background:rgba(255,255,255,.1);border-radius:16px;padding:10px 20px;}
  .math-op{color:#ffd93d;font-size:2.5rem;}
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .opt-btn{padding:18px;border-radius:18px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);color:white;cursor:pointer;font-family:'Nunito',sans-serif;font-size:1.1rem;font-weight:700;transition:.3s;text-align:center;}
  .opt-btn:hover{border-color:#4d96ff;background:rgba(77,150,255,.15);transform:scale(1.03);}
  .opt-btn.correct{background:linear-gradient(135deg,#6bcb77,#00d4aa)!important;border-color:#6bcb77!important;animation:pulseg .5s;}
  .opt-btn.wrong{background:linear-gradient(135deg,#ff6b6b,#ff4444)!important;border-color:#ff6b6b!important;animation:shk .4s;}
  @keyframes pulseg{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .feedback-text{font-family:'Fredoka One',cursive;font-size:1.8rem;text-align:center;margin:14px 0;min-height:44px;}
  .feedback-text.correct{color:#6bcb77;}
  .feedback-text.wrong{color:#ff6b6b;}
  .progress-bar{background:rgba(255,255,255,.1);border-radius:10px;height:10px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,#4d96ff,#c77dff);transition:width .5s;}
  .balloon-area{position:relative;height:400px;overflow:hidden;background:linear-gradient(180deg,#1a0533,#0d0b1e);border-radius:24px;margin-bottom:20px;}
  .balloon{position:absolute;cursor:pointer;text-align:center;user-select:none;animation:floatUp linear forwards;display:flex;flex-direction:column;align-items:center;}
  .balloon .btext{background:rgba(0,0,0,.6);border-radius:12px;padding:4px 10px;font-size:.85rem;font-weight:700;margin-top:2px;color:white;}
  @keyframes floatUp{0%{bottom:-80px;opacity:1}100%{bottom:110%;opacity:0}}
  .blank-input{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.3);border-radius:16px;padding:16px 24px;font-size:2rem;font-family:'Fredoka One',cursive;color:white;text-align:center;outline:none;width:100%;max-width:340px;display:block;margin:0 auto;}
  .blank-input:focus{border-color:#ffd93d;box-shadow:0 0 20px rgba(255,217,61,.3);}
  .submit-btn{background:linear-gradient(135deg,#4d96ff,#c77dff);border:none;color:white;padding:14px 40px;border-radius:20px;font-family:'Fredoka One',cursive;font-size:1.3rem;cursor:pointer;margin:16px auto 0;display:block;transition:.3s;}
  .submit-btn:hover{transform:scale(1.05);}
  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:480px;margin:0 auto;}
  .mem-card{aspect-ratio:1;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:.95rem;font-weight:700;background:linear-gradient(135deg,#1e1e3a,#2d2d5a);border:2px solid rgba(255,255,255,.15);transition:.4s;text-align:center;padding:6px;line-height:1.2;}
  .mem-card.flipped{background:linear-gradient(135deg,#4d96ff,#c77dff);border-color:#4d96ff;}
  .mem-card.matched{background:linear-gradient(135deg,#6bcb77,#00d4aa)!important;border-color:#6bcb77!important;animation:pop .4s;}
  @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .timer-ring{width:90px;height:90px;margin:0 auto;position:relative;}
  .timer-ring svg{transform:rotate(-90deg);}
  .timer-ring circle{fill:none;stroke-width:8;}
  .timer-ring .bg{stroke:rgba(255,255,255,.1);}
  .timer-ring .prog{stroke:#ffd93d;transition:stroke-dasharray .2s;}
  .timer-val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Fredoka One',cursive;font-size:1.8rem;color:#ffd93d;}
  .count-track{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:16px;}
  .track-num{width:64px;height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:1.1rem;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.1);cursor:pointer;transition:.3s;}
  .track-num span.us{font-size:.48rem;color:#aaa;font-family:'Nunito',sans-serif;text-align:center;}
  .track-num.correct{background:linear-gradient(135deg,#6bcb77,#00d4aa)!important;border-color:#6bcb77!important;}
  .track-num.wrong{animation:shk .4s;}
  .result-card{background:rgba(255,255,255,.07);border-radius:24px;padding:40px;text-align:center;margin-top:20px;}
  .result-card h2{font-family:'Fredoka One',cursive;font-size:2.5rem;margin-bottom:12px;}
  .result-card .big-score{font-family:'Fredoka One',cursive;font-size:5rem;color:#ffd93d;}
  .play-again{background:linear-gradient(135deg,#ff6b6b,#ffd93d);border:none;color:#1a1a2e;padding:16px 50px;border-radius:24px;font-family:'Fredoka One',cursive;font-size:1.5rem;cursor:pointer;margin-top:20px;transition:.3s;}
  .play-again:hover{transform:scale(1.05);}
  .confetti-piece{position:fixed;top:-20px;border-radius:2px;animation:cfall linear forwards;pointer-events:none;z-index:999;}
  @keyframes cfall{0%{top:-20px;transform:rotate(0deg)}100%{top:110vh;transform:rotate(720deg)}}
  .settings-panel{background:rgba(255,255,255,.07);border-radius:20px;padding:16px 20px;margin-bottom:20px;}
  .settings-panel h3{font-family:'Fredoka One',cursive;font-size:1.2rem;margin-bottom:12px;color:#ffd93d;}
  .toggle-row{display:flex;gap:8px;flex-wrap:wrap;}
  .toggle-chip{padding:8px 14px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:transparent;color:#aaa;cursor:pointer;font-family:'Nunito',sans-serif;font-size:.85rem;font-weight:700;transition:.3s;}
  .toggle-chip.on{border-color:#6bcb77;color:#6bcb77;background:rgba(107,203,119,.1);}
  /* DRAG DROP */
  .drag-container{margin:0 auto;max-width:600px;}
  .drag-zone{min-height:70px;border:3px dashed rgba(255,255,255,.25);border-radius:16px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:12px;transition:.3s;margin-bottom:14px;}
  .drag-zone.over{border-color:#ffd93d;background:rgba(255,217,61,.1);}
  .drag-slot{background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.2);border-radius:14px;padding:14px 22px;font-family:'Fredoka One',cursive;font-size:1.1rem;color:#555;min-width:80px;text-align:center;}
  .drag-item{background:linear-gradient(135deg,#4d96ff,#c77dff);padding:12px 20px;border-radius:14px;cursor:grab;font-family:'Fredoka One',cursive;font-size:1.1rem;user-select:none;transition:.2s;display:inline-block;}
  .drag-item:hover{transform:scale(1.05);}
  @media(max-width:600px){.options-grid{grid-template-columns:1fr 1fr;}.math-display{font-size:2rem;}.memory-grid{grid-template-columns:repeat(4,1fr);gap:8px;}.mem-card{font-size:.8rem;}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- HUB -->
<div class="screen active" id="hub">
  <div class="hub-header">
    <div class="lang-badge">É̩mè̩ ǹgo! É̩me̩ ńgà!</div>
    <h1>URO NUMBERS</h1>
    <p>Learn · Count · Play · Remember the Uro language</p>
  </div>
  <div class="grade-bar">
    <button class="grade-btn active" onclick="setGrade(1)">Grade 1 (1–20)</button>
    <button class="grade-btn" onclick="setGrade(2)">Grade 2 (1–50)</button>
    <button class="grade-btn" onclick="setGrade(3)">Grade 3 (1–100)</button>
    <button class="grade-btn" onclick="setGrade(4)">Grade 4 (1–200)</button>
  </div>
  <div class="games-grid" id="gamesGrid"></div>
</div>

<!-- GAME SCREEN -->
<div class="screen" id="game-screen">
  <button class="back-btn" onclick="goHub()">← Hub</button>
  <div id="game-content"></div>
</div>

<script>
// === DATA ===
const URO_RAW=[[1,"ọ̀lọ̀"],[2,"ìyí"],[3,"ìda"],[4,"inẹ́"],[5,"íńtọ́"],[6,"ìfà"],[7,"íshwí"],[8,"íro"],[9,"íńdá"],[10,"íyè"],[11,"íyè-gu-ọ̀lọ̀"],[12,"íyè-gu-ìyí"],[13,"íyè-gu-ìda"],[14,"íyè-gu-inẹ́"],[15,"íyè-gu-íńtọ́"],[16,"íyè-gu-ìfà"],[17,"íyè-gu-íshwí"],[18,"íyè-gu-íro"],[19,"íyè-gu-íńdá"],[20,"ùgbọrọ̀"],[21,"ugbọrọ-rẹ-ọ̀lọ̀"],[22,"ugbọrọ-rẹ-ìyí"],[23,"ugbọrọ-rẹ-ìda"],[24,"ugbọrọ-rẹ-inẹ́"],[25,"ugbọrọ-rẹ-íńtọ́"],[26,"ugbọrọ-rẹ-ìfà"],[27,"ugbọrọ-rẹ-íshwí"],[28,"ugbọrọ-rẹ-íro"],[29,"ugbọrọ-rẹ-íńdá"],[30,"ọ́ńgbà"],[31,"ọ́ńgbà-rẹ-ọ̀lọ̀"],[32,"ọ́ńgbà-rẹ-ìyí"],[33,"ọ́ńgbà-rẹ-ìda"],[34,"ọ́ńgbà-rẹ-inẹ́"],[35,"ọ́ńgbà-rẹ-íńtọ́"],[36,"ọ́ńgbà-rẹ-ìfà"],[37,"ọ́ńgbà-rẹ-íshwí"],[38,"ọ́ńgbà-rẹ-íro"],[39,"ọ́ńgbà-rẹ-íńdá"],[40,"orìnyí"],[41,"orìnyí-rẹ-ọ̀lọ̀"],[42,"orìnyí-rẹ-ìyí"],[43,"orìnyí-rẹ-ìda"],[44,"orìnyí-rẹ-inẹ́"],[45,"orìnyí-rẹ-íńtọ́"],[46,"orìnyí-rẹ-ìfà"],[47,"orìnyí-rẹ-íshwí"],[48,"orìnyí-rẹ-íro"],[49,"orìnyí-rẹ-íńdá"],[50,"íyerẹ̀yí"],[51,"íyerẹ̀yí-rẹ-ọ̀lọ̀"],[52,"íyerẹ̀yí-rẹ-ìyí"],[53,"íyerẹ̀yí-rẹ-ìda"],[54,"íyerẹ̀yí-rẹ-inẹ́"],[55,"íyerẹ̀yí-rẹ-íńtọ́"],[56,"íyerẹ̀yí-rẹ-ìfà"],[57,"íyerẹ̀yí-rẹ-íshwí"],[58,"íyerẹ̀yí-rẹ-íro"],[59,"íyerẹ̀yí-rẹ-íńdá"],[60,"orínda"],[61,"orínda-rẹ-ọ̀lọ̀"],[62,"orínda-rẹ-ìyí"],[63,"orínda-rẹ-ìda"],[64,"orínda-rẹ-inẹ́"],[65,"orínda-rẹ-íńtọ́"],[66,"orínda-rẹ-ìfà"],[67,"orínda-rẹ-íshwí"],[68,"orínda-rẹ-íro"],[69,"orínda-rẹ-íńdá"],[70,"íyerẹdà"],[71,"íyerẹdà-rẹ-ọ̀lọ̀"],[72,"íyerẹdà-rẹ-ìyí"],[73,"íyerẹdà-rẹ-ìda"],[74,"íyerẹdà-rẹ-inẹ́"],[75,"íyerẹdà-rẹ-íńtọ́"],[76,"íyerẹdà-rẹ-ìfà"],[77,"íyerẹdà-rẹ-íshwí"],[78,"íyerẹdà-rẹ-íro"],[79,"íyerẹdà-rẹ-íńdá"],[80,"òrinẹ́"],[81,"òrinẹ́-rẹ-ọ̀lọ̀"],[82,"òrinẹ́-rẹ-ìyí"],[83,"òrinẹ́-rẹ-ìda"],[84,"òrinẹ́-rẹ-inẹ́"],[85,"òrinẹ́-rẹ-íńtọ́"],[86,"òrinẹ́-rẹ-ìfà"],[87,"òrinẹ́-rẹ-íshwí"],[88,"òrinẹ́-rẹ-íro"],[89,"òrinẹ́-rẹ-íńdá"],[90,"íyerẹnẹ́"],[91,"íyerẹnẹ́-rẹ-ọ̀lọ̀"],[92,"íyerẹnẹ́-rẹ-ìyí"],[93,"íyerẹnẹ́-rẹ-ìda"],[94,"íyerẹnẹ́-rẹ-inẹ́"],[95,"íyerẹnẹ́-rẹ-íńtọ́"],[96,"íyerẹnẹ́-rẹ-ìfà"],[97,"íyerẹnẹ́-rẹ-íshwí"],[98,"íyerẹnẹ́-rẹ-íro"],[99,"íyerẹnẹ́-rẹ-íńdá"],[100,"oríntọ̀"],[110,"íjerẹ́ńtọ̀"],[120,"orínfà"],[130,"íjerẹfà"],[140,"orínshwí"],[150,"íjerẹshwí"],[160,"orínro"],[170,"íjerẹro"],[180,"oríńdà"],[190,"íjerẹdà"],[200,"orínyè"]];
const URO={};
URO_RAW.forEach(([n,w])=>{URO[n]=w;});
function getUro(n){return URO[n]||String(n);}

let grade=1,gradeMax=20;
const GRADE_MAXES={1:20,2:50,3:100,4:200};
function setGrade(g){grade=g;gradeMax=GRADE_MAXES[g];document.querySelectorAll('.grade-btn').forEach((b,i)=>b.classList.toggle('active',i===g-1));}
function gradeNums(){return URO_RAW.map(([n])=>n).filter(n=>n>=1&&n<=gradeMax);}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// === GAMES CATALOG ===
const GAMES=[
  {id:'quiz',title:'Number Quiz',emoji:'🎯',desc:'See a number — pick the Uro word!',badge:'MCQ',c1:'#ff6b6b',c2:'#cc1a55'},
  {id:'reverse',title:'Word Hunt',emoji:'🔍',desc:'See the Uro word — find the number!',badge:'MCQ',c1:'#4d96ff',c2:'#0033cc'},
  {id:'math',title:'Math Wizard',emoji:'🧮',desc:'Solve + − × ÷ and answer in Uro!',badge:'MATH',c1:'#6bcb77',c2:'#008833'},
  {id:'balloon',title:'Balloon Pop',emoji:'🎈',desc:'Pop the correct Uro balloon before it escapes!',badge:'ACTION',c1:'#ffd93d',c2:'#ff8c00'},
  {id:'memory',title:'Memory Match',emoji:'🃏',desc:'Match numbers to their Uro words!',badge:'MEMORY',c1:'#c77dff',c2:'#6600cc'},
  {id:'speed',title:'Speed Blitz',emoji:'⚡',desc:'30 seconds. How many can you smash?',badge:'SPEED',c1:'#00d4aa',c2:'#006655'},
  {id:'fillblank',title:'Fill the Blank',emoji:'✏️',desc:'Type the missing Uro number!',badge:'TYPE',c1:'#ff9a3c',c2:'#cc4400'},
  {id:'sequence',title:'Count Trail',emoji:'🐾',desc:'Tap numbers in Uro order!',badge:'ORDER',c1:'#ff6eb4',c2:'#aa0066'},
];

function buildHub(){
  document.getElementById('gamesGrid').innerHTML=GAMES.map(g=>`
    <div class="game-card" style="--c1:${g.c1};--c2:${g.c2}" onclick="startGame('${g.id}')">
      <span class="badge">${g.badge}</span>
      <span class="emoji">${g.emoji}</span>
      <h3>${g.title}</h3>
      <p>${g.desc}</p>
    </div>`).join('');
}
function buildStars(){
  const s=document.getElementById('stars');
  for(let i=0;i<80;i++){
    const d=document.createElement('div');d.className='star';
    const sz=Math.random()*3+1;
    d.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
    s.appendChild(d);
  }
}

let currentGame=null,currentState={};
function goHub(){
  document.getElementById('hub').classList.add('active');
  document.getElementById('game-screen').classList.remove('active');
  if(currentState.timer)clearInterval(currentState.timer);
  if(currentState.btimer)clearTimeout(currentState.btimer);
}
function startGame(id){
  currentGame=id;currentState={score:0,streak:0};
  document.getElementById('hub').classList.remove('active');
  document.getElementById('game-screen').classList.add('active');
  window.scrollTo(0,0);
  document.getElementById('game-content').innerHTML='';
  RUNNERS[id](GAMES.find(x=>x.id===id));
}

// UI helpers
function sbar(){return`<div class="score-bar"><div class="score-item"><div class="val" id="sdsp">0</div><div class="lbl">Score</div></div><div class="score-item"><div class="val" id="qdsp">0/10</div><div class="lbl">Question</div></div><div class="score-item"><div class="val" id="strdsp">🔥0</div><div class="lbl">Streak</div></div></div>`;}
function upSc(s){const e=document.getElementById('sdsp');if(e)e.textContent=s;}
function upQ(q,t){const e=document.getElementById('qdsp');if(e)e.textContent=q+'/'+t;}
function upStr(s){const e=document.getElementById('strdsp');if(e)e.textContent='🔥'+s;}
function result(score,total,g){
  const pct=Math.round(score/total*100);
  const msg=pct>=80?'🏆 You speak Uro!':pct>=50?'👏 Good job!':'💪 Keep practicing!';
  confetti();
  return`<div class="result-card"><h2>${msg}</h2><div class="big-score">${score}/${total}</div><p style="color:#aaa;margin-top:8px">${pct}% correct</p><button class="play-again" onclick="startGame('${g}')">Play Again 🎮</button></div>`;
}
function makeOpts(correct,pool,count,label){
  const s=new Set([correct]);
  shuffle([...pool]).forEach(n=>{if(s.size<count&&n!==correct)s.add(n);});
  return shuffle([...s]).map(n=>({val:n,label:label(n)}));
}
function confetti(){
  const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9a3c'];
  for(let i=0;i<60;i++){
    const c=document.createElement('div');c.className='confetti-piece';
    c.style.cssText=`left:${Math.random()*100}vw;background:${cols[i%6]};width:${7+Math.random()*8}px;height:${7+Math.random()*8}px;animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.5}s;border-radius:${Math.random()>.5?'50%':'2px'}`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),5000);
  }
}
function mini(){
  const cols=['#ffd93d','#6bcb77','#4d96ff'];
  for(let i=0;i<14;i++){
    const c=document.createElement('div');c.className='confetti-piece';
    c.style.cssText=`left:${30+Math.random()*40}vw;background:${cols[i%3]};width:7px;height:7px;animation-duration:1.2s;animation-delay:${Math.random()*.2}s;border-radius:50%`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),1600);
  }
}

const RUNNERS={};

// === QUIZ ===
RUNNERS.quiz=function(){
  const nums=gradeNums();let qs=shuffle([...nums]).slice(0,10),qi=0,score=0,streak=0,lock=false;
  function render(){
    if(qi>=qs.length){document.getElementById('game-content').innerHTML='<div class="game-title" style="color:#ff6b6b">🎯 Number Quiz</div>'+result(score,qs.length,'quiz');return;}
    const n=qs[qi],opts=makeOpts(n,nums,4,x=>getUro(x));
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#ff6b6b">🎯 Number Quiz</div>${sbar()}<div class="progress-bar"><div class="progress-fill" style="width:${qi/qs.length*100}%"></div></div><div class="q-card"><div class="q-label">What is this number in Uro?</div><div class="q-number">${n}</div></div><div class="options-grid">${opts.map((o,i)=>`<button class="opt-btn" id="ob${i}" onclick="qa(${o.val},${n},${i})">${o.label}</button>`).join('')}</div><div class="feedback-text" id="fb"></div>`;
    upSc(score);upQ(qi+1,qs.length);upStr(streak);
  }
  window.qa=function(ch,co,i){
    if(lock)return;lock=true;const ok=ch===co;
    if(ok){score++;streak++;mini();}else streak=0;
    document.getElementById('ob'+i).classList.add(ok?'correct':'wrong');
    const fb=document.getElementById('fb');fb.textContent=ok?'✅ '+getUro(co):'❌ '+getUro(co);fb.className='feedback-text '+(ok?'correct':'wrong');
    if(!ok)document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===getUro(co))b.classList.add('correct');});
    setTimeout(()=>{lock=false;qi++;render();},1400);
  };
  render();
};

// === REVERSE ===
RUNNERS.reverse=function(){
  const nums=gradeNums();let qs=shuffle([...nums]).slice(0,10),qi=0,score=0,streak=0,lock=false;
  function render(){
    if(qi>=qs.length){document.getElementById('game-content').innerHTML='<div class="game-title" style="color:#4d96ff">🔍 Word Hunt</div>'+result(score,qs.length,'reverse');return;}
    const n=qs[qi],opts=makeOpts(n,nums,4,x=>x);
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#4d96ff">🔍 Word Hunt</div>${sbar()}<div class="progress-bar"><div class="progress-fill" style="width:${qi/qs.length*100}%"></div></div><div class="q-card"><div class="q-label">Which number is this Uro word?</div><div class="q-number" style="font-size:2rem">${getUro(n)}</div></div><div class="options-grid">${opts.map((o,i)=>`<button class="opt-btn" id="ob${i}" onclick="ra(${o.val},${n},${i})">${o.val}</button>`).join('')}</div><div class="feedback-text" id="fb"></div>`;
    upSc(score);upQ(qi+1,qs.length);upStr(streak);
  }
  window.ra=function(ch,co,i){
    if(lock)return;lock=true;const ok=ch===co;
    if(ok){score++;streak++;mini();}else streak=0;
    document.getElementById('ob'+i).classList.add(ok?'correct':'wrong');

    if(!ok)document.querySelectorAll('.opt-btn').forEach(b=>{if(parseInt(b.textContent)===co)b.classList.add('correct');});
    setTimeout(()=>{lock=false;qi++;render();},1400);
  };
  render();
};

// === MATH WIZARD ===
RUNNERS.math=function(){
  let activeOps=['+','-'],qi=0,score=0,streak=0,total=10,lock=false;
  const OPS=['+','-','×','÷'];
  function genQ(){
    const op=activeOps[randInt(0,activeOps.length-1)];
    let a,b,ans,tries=0;
    do{
      tries++;
      if(op==='+'){a=randInt(1,Math.floor(gradeMax*.5));b=randInt(1,Math.floor(gradeMax*.5));ans=a+b;}
      else if(op==='-'){a=randInt(2,gradeMax);b=randInt(1,a-1);ans=a-b;}
      else if(op==='×'){a=randInt(1,10);b=randInt(1,10);ans=a*b;}
      else{b=randInt(1,10);ans=randInt(1,Math.max(1,Math.floor(gradeMax/b)));a=b*ans;}
    }while((ans<1||ans>200||!URO[ans])&&tries<60);
    if(!URO[ans]||ans<1||ans>200){a=randInt(1,10);b=randInt(1,10);ans=a+b;if(!URO[ans]){a=2;b=3;ans=5;}}
    return{a,b,ans,op};
  }
  function renderSet(){
    return`<div class="settings-panel"><h3>⚙️ Choose Operations</h3><div class="toggle-row">${OPS.map(o=>`<button class="toggle-chip ${activeOps.includes(o)?'on':''}" onclick="togOp('${o}',this)">${o==='+'?'➕ Add':o==='-'?'➖ Sub':o==='×'?'✖️ Mul':'➗ Div'}</button>`).join('')}</div></div>`;
  }
  function render(){
    if(qi>=total){document.getElementById('game-content').innerHTML='<div class="game-title" style="color:#6bcb77">🧮 Math Wizard</div>'+result(score,total,'math');return;}
    const {a,b,ans,op}=genQ();
    const pool=gradeNums().filter(n=>URO[n]);
    const opts=makeOpts(ans,pool,4,x=>getUro(x));
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#6bcb77">🧮 Math Wizard</div>${renderSet()}${sbar()}<div class="progress-bar"><div class="progress-fill" style="width:${qi/total*100}%"></div></div><div class="q-card"><div class="q-label">Solve & answer in Uro!</div><div class="math-display"><span class="math-num">${a}</span><span class="math-op">${op}</span><span class="math-num">${b}</span><span class="math-op">=</span><span class="math-num">?</span></div></div><div class="options-grid">${opts.map((o,i)=>`<button class="opt-btn" id="ob${i}" onclick="ma(${o.val},${ans},${i})">${o.label}</button>`).join('')}</div><div class="feedback-text" id="fb"></div>`;
    upSc(score);upQ(qi+1,total);upStr(streak);
  }
  window.togOp=function(op,btn){
    if(activeOps.includes(op)){if(activeOps.length===1)return;activeOps=activeOps.filter(x=>x!==op);btn.classList.remove('on');}
    else{activeOps.push(op);btn.classList.add('on');}
  };
  window.ma=function(ch,co,i){
    if(lock)return;lock=true;const ok=ch===co;
    if(ok){score++;streak++;mini();}else streak=0;
    document.getElementById('ob'+i).classList.add(ok?'correct':'wrong');
    const fb=document.getElementById('fb');fb.textContent=ok?'✅ '+getUro(co):'❌ '+co+' = '+getUro(co);fb.className='feedback-text '+(ok?'correct':'wrong');
    if(!ok)document.querySelectorAll('.opt-btn').forEach(b=>{if(b.textContent===getUro(co))b.classList.add('correct');});
    setTimeout(()=>{lock=false;qi++;render();},1500);
  };
  render();
};

// === BALLOON POP ===
RUNNERS.balloon=function(){
  let score=0,missed=0,qi=0,total=12,lock=false;
  const EMOJIS=['🔴','🟠','🟡','🟢','🔵','🟣','🩷','🤍','🧡'];
  function render(){
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#ffd93d">🎈 Balloon Pop!</div><div class="score-bar"><div class="score-item"><div class="val" id="sdsp">${score}</div><div class="lbl">Popped ✓</div></div><div class="score-item"><div class="val" id="qdsp">${qi}/${total}</div><div class="lbl">Round</div></div><div class="score-item"><div class="val" id="msdsp" style="color:#ff6b6b">${missed}</div><div class="lbl">Missed</div></div></div><div class="q-card" style="padding:20px"><div class="q-label">Pop the balloon showing:</div><div class="q-number" id="tgt">...</div><div class="q-uro" id="turo">...</div></div><div class="balloon-area" id="barea"></div><div class="feedback-text" id="fb"></div>`;
    nextRound();
  }
  function nextRound(){
    if(qi>=total){document.getElementById('game-content').innerHTML='<div class="game-title" style="color:#ffd93d">🎈 Balloon Pop!</div>'+result(score,total,'balloon');return;}
    lock=false;
    const nums=gradeNums();
    const target=nums[randInt(0,nums.length-1)];
    const t=document.getElementById('tgt');if(t)t.textContent=target;
    const tu=document.getElementById('turo');if(tu)tu.textContent=getUro(target);
    qi++;const qd=document.getElementById('qdsp');if(qd)qd.textContent=qi+'/'+total;
    const area=document.getElementById('barea');if(!area)return;
    area.innerHTML='';
    const wrongs=shuffle(nums.filter(n=>n!==target)).slice(0,3);
    shuffle([target,...wrongs]).forEach((n,i)=>{
      const b=document.createElement('div');b.className='balloon';
      const dur=7+randInt(0,5);
      b.style.cssText=`left:${8+i*23}%;animation-duration:${dur}s;`;
      b.innerHTML=`<span style="font-size:3.2rem">${EMOJIS[randInt(0,EMOJIS.length-1)]}</span><span class="btext">${getUro(n)}</span>`;
      b.onclick=()=>pop(n,target,b);
      area.appendChild(b);
    });
    if(currentState.btimer)clearTimeout(currentState.btimer);
    currentState.btimer=setTimeout(()=>{
      if(!lock){lock=true;missed++;const md=document.getElementById('msdsp');if(md)md.textContent=missed;
      const fb=document.getElementById('fb');if(fb){fb.textContent='⏰ They escaped!';fb.className='feedback-text wrong';}
      setTimeout(nextRound,1000);}
    },6500);
  }
  window.pop=function(ch,co,el){
    if(lock)return;lock=true;clearTimeout(currentState.btimer);
    const ok=ch===co;
    if(ok){score++;mini();}else missed++;
    el.style.transition='.3s';el.style.transform='scale(2.5)';el.style.opacity='0';
    const fb=document.getElementById('fb');
    if(fb){fb.textContent=ok?'💥 Pop! +1':'❌ '+getUro(ch)+' ≠ '+getUro(co);fb.className='feedback-text '+(ok?'correct':'wrong');}
    const sd=document.getElementById('sdsp');if(sd)sd.textContent=score;
    const md=document.getElementById('msdsp');if(md)md.textContent=missed;
    setTimeout(nextRound,1100);
  };
  render();
};

// === MEMORY MATCH ===
RUNNERS.memory=function(){
  const pool=gradeNums().slice(0,8);
  const pairs=shuffle(pool).slice(0,6);
  const cards=shuffle([...pairs.map(n=>({n,t:'num'})),...pairs.map(n=>({n,t:'uro'}))]);
  let flipped=[],matched=new Set(),moves=0,wait=false;
  function render(){
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#c77dff">🃏 Memory Match</div><div class="score-bar"><div class="score-item"><div class="val" id="mdisp">0/${pairs.length}</div><div class="lbl">Matched</div></div><div class="score-item"><div class="val" id="mvdisp">0</div><div class="lbl">Moves</div></div></div><p style="text-align:center;color:#aaa;margin-bottom:16px;font-size:.9rem">Match each number to its Uro word!</p><div class="memory-grid" id="mgrid">${cards.map((_,i)=>`<div class="mem-card" id="mc${i}" onclick="flip(${i})">❓</div>`).join('')}</div><div class="feedback-text" id="fb"></div>`;
  }
  window.flip=function(i){
    if(wait||matched.has(i)||flipped.includes(i))return;
    const el=document.getElementById('mc'+i);if(!el)return;
    el.classList.add('flipped');el.textContent=cards[i].t==='num'?cards[i].n:getUro(cards[i].n);
    flipped.push(i);
    if(flipped.length===2){
      moves++;const mv=document.getElementById('mvdisp');if(mv)mv.textContent=moves;
      wait=true;const[a,b]=flipped;
      if(cards[a].n===cards[b].n&&cards[a].t!==cards[b].t){
        [a,b].forEach(x=>{matched.add(x);const e=document.getElementById('mc'+x);if(e)e.classList.add('matched');});
        flipped=[];wait=false;
        const md=document.getElementById('mdisp');if(md)md.textContent=matched.size/2+'/'+pairs.length;
        if(matched.size===cards.length){confetti();setTimeout(()=>{document.getElementById('game-content').innerHTML='<div class="game-title" style="color:#c77dff">🃏 Memory Match</div>'+result(pairs.length,pairs.length,'memory');},700);}
      } else {
        setTimeout(()=>{[a,b].forEach(x=>{const e=document.getElementById('mc'+x);if(e){e.classList.remove('flipped');e.textContent='❓';}});flipped=[];wait=false;},900);
      }
    }
  };
  render();
};

// === SPEED BLITZ ===
RUNNERS.speed=function(){
  let score=0,tl=30,lock=false;
  if(currentState.timer)clearInterval(currentState.timer);
  function genQ(){
    const nums=gradeNums();const n=nums[randInt(0,nums.length-1)];
    const m=Math.random()>.5?'n2u':'u2n';
    return{n,m,opts:makeOpts(n,nums,4,m==='n2u'?x=>getUro(x):x=>x)};
  }
  let q=genQ();
  function render(){
    const p=(tl/30)*283;
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#00d4aa">⚡ Speed Blitz</div><div class="score-bar"><div class="score-item"><div class="val" id="sdsp">${score}</div><div class="lbl">Score</div></div><div class="score-item"><div class="timer-ring"><svg viewBox="0 0 100 100" width="80" height="80"><circle class="bg" cx="50" cy="50" r="45"/><circle class="prog" id="tc" cx="50" cy="50" r="45" stroke-dasharray="${p} 283"/></svg><div class="timer-val" id="tv">${tl}</div></div></div><div class="score-item"><div class="val" id="strdsp">🔥0</div><div class="lbl">Streak</div></div></div><div class="q-card"><div class="q-label">${q.m==='n2u'?'Number → Uro word':'Uro word → Number'}</div><div class="q-number" style="${q.m==='u2n'?'font-size:1.8rem':''}">${q.m==='n2u'?q.n:getUro(q.n)}</div></div><div class="options-grid">${q.opts.map((o,i)=>`<button class="opt-btn" id="ob${i}" onclick="sa(${o.val},${q.n},${i})">${o.label}</button>`).join('')}</div><div class="feedback-text" id="fb"></div>`;
  }
  window.sa=function(ch,co,i){
    if(tl<=0)return;const ok=ch===co;
    if(ok){score++;document.getElementById('sdsp').textContent=score;mini();}
    document.getElementById('ob'+i).classList.add(ok?'correct':'wrong');
    const fb=document.getElementById('fb');if(fb){fb.textContent=ok?'✅ Fast!':'❌ Nope!';fb.className='feedback-text '+(ok?'correct':'wrong');}
    setTimeout(()=>{q=genQ();render();},500);
  };
  render();
  currentState.timer=setInterval(()=>{
    tl--;
    const tv=document.getElementById('tv');const tc=document.getElementById('tc');
    if(tv)tv.textContent=tl;if(tc)tc.setAttribute('stroke-dasharray',(tl/30)*283+' 283');
    if(tl<=0){
      clearInterval(currentState.timer);
      document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#00d4aa">⚡ Speed Blitz</div><div class="result-card"><h2>⏰ Time's Up!</h2><div class="big-score">${score}</div><p style="color:#aaa">answers correct</p><button class="play-again" onclick="startGame('speed')">Play Again ⚡</button></div>`;
    }
  },1000);
};

// === FILL THE BLANK ===
RUNNERS.fillblank=function(){
  const nums=gradeNums();let qs=shuffle([...nums]).slice(0,10),qi=0,score=0,lock=false;
  function render(){
    if(qi>=qs.length){document.getElementById('game-content').innerHTML='<div class="game-title" style="color:#ff9a3c">✏️ Fill the Blank</div>'+result(score,qs.length,'fillblank');return;}
    const n=qs[qi],m=Math.random()>.5?'n2u':'u2n';
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#ff9a3c">✏️ Fill the Blank</div>${sbar()}<div class="progress-bar"><div class="progress-fill" style="width:${qi/qs.length*100}%"></div></div><div class="q-card"><div class="q-label">${m==='n2u'?'Write this number in Uro:':'Which number is this?'}</div><div class="q-number" style="${m==='u2n'?'font-size:1.8rem':''}">${m==='n2u'?n:getUro(n)}</div></div><input class="blank-input" id="binp" placeholder="${m==='n2u'?'Type the Uro word...':'Type the number...'}" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')cb(${n},'${m}')"><button class="submit-btn" onclick="cb(${n},'${m}')">Check ✓</button><div class="feedback-text" id="fb"></div>`;
    upSc(score);upQ(qi+1,qs.length);
    setTimeout(()=>{const e=document.getElementById('binp');if(e)e.focus();},80);
  }
  window.cb=function(n,m){
    if(lock)return;const inp=document.getElementById('binp');if(!inp)return;
    const val=inp.value.trim();lock=true;
    const ok=m==='n2u'?val.toLowerCase()===getUro(n).toLowerCase():parseInt(val)===n;
    if(ok){score++;mini();}
    const fb=document.getElementById('fb');
    fb.textContent=ok?'✅ Correct!':'❌ Answer: '+(m==='n2u'?getUro(n):n);fb.className='feedback-text '+(ok?'correct':'wrong');
    inp.style.borderColor=ok?'#6bcb77':'#ff6b6b';upSc(score);
    setTimeout(()=>{lock=false;qi++;render();},1600);
  };
  render();
};

// === COUNT TRAIL ===
RUNNERS.sequence=function(){
  let score=0,round=0,total=5;
  let currentSeq=[],ni=0;
  function startRound(){
    if(round>=total){document.getElementById('game-content').innerHTML='<div class="game-title" style="color:#ff6eb4">🐾 Count Trail</div>'+result(score,total,'sequence');return;}
    const nums=gradeNums();
    const si=randInt(0,Math.max(0,nums.length-6));
    currentSeq=nums.slice(si,si+5);
    ni=0;
    document.getElementById('game-content').innerHTML=`<div class="game-title" style="color:#ff6eb4">🐾 Count Trail</div>${sbar()}<div class="q-card" style="padding:20px"><div class="q-label">Tap numbers smallest → largest in Uro order</div><div id="nhint" style="font-family:'Fredoka One';font-size:1.4rem;color:#ffd93d">Next: ${getUro(currentSeq[0])}</div></div><div class="count-track" id="ctrack">${shuffle([...currentSeq]).map(n=>`<div class="track-num" id="tn${n}" onclick="tapN(${n})">${getUro(n)}</div>`).join('')}</div><div class="feedback-text" id="fb"></div>`;
    upSc(score);upQ(round+1,total);
  }
  window.tapN=function(tapped){
    const el=document.getElementById('tn'+tapped);
    if(tapped===currentSeq[ni]){
      if(el)el.classList.add('correct');ni++;mini();
      if(ni>=currentSeq.length){
        score++;round++;
        const fb=document.getElementById('fb');if(fb){fb.textContent='🎉 Perfect!';fb.className='feedback-text correct';}
        upSc(score);setTimeout(startRound,1100);
      } else {
        const nh=document.getElementById('nhint');if(nh)nh.textContent='Next: '+getUro(currentSeq[ni]);
      }
    } else {
      if(el){el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500);}
      const fb=document.getElementById('fb');if(fb){fb.textContent='❌ Wrong! Try again';fb.className='feedback-text wrong';}
    }
  };
  startRound();
};
